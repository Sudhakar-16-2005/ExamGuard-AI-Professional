services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: examguard
      POSTGRES_USER: examguard
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - examguard_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: local-docker-secret-change-me
      DEBUG: "True"
      ALLOWED_HOSTS: 127.0.0.1,localhost
      DATABASE_URL: postgresql://examguard:local-development-only@db:5432/examguard
      OCR_ENGINE: tesseract
    volumes:
      - examguard_media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  examguard_postgres:
  examguard_media:
